@if (!appDataService.connection.tor) {

<div id="PrivacyBadge" class="privacy-banner">


  <div class="privacy-glow"></div>


  <div class="privacy-inner">


    <!-- Security Logo -->
    <div class="privacy-icon-wrapper">

      <div class="privacy-icon">

        <i class="fas fa-shield-halved"></i>

      </div>

    </div>



    <!-- Content -->

    <div class="privacy-content">


      <div class="privacy-title">

        {{ 'Speak Up With Confidence' | translate }}

      </div>



      <div class="privacy-message">

        {{ 'A trusted channel to report concerns safely, confidentially, and responsibly.' | translate }}

      </div>



      <div class="privacy-points">


        <span>
          <i class="fas fa-lock"></i>
          {{ 'Protected' | translate }}
        </span>


        <span>
          <i class="fas fa-user-secret"></i>
          {{ 'Confidential' | translate }}
        </span>


        <span>
          <i class="fas fa-scale-balanced"></i>
          {{ 'Integrity First' | translate }}
        </span>


      </div>


    </div>


  </div>

</div>

}
